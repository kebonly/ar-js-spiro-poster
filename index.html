<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spirochete AR &mdash; poster companion</title>

<!-- Libraries are vendored rather than loaded from a CDN: conference wifi is
     unreliable and a CDN miss would break the poster in front of an audience.
     A-Frame 1.3.0 + AR.js 3.4.7 is a known-good pairing; newer A-Frame
     releases have regressions against AR.js 3.4.x. -->
<script src="vendor/aframe.min.js"></script>
<script src="vendor/aframe-ar.js"></script>
<script src="config.js"></script>

<style>
  :root { --ink: #0b1221; --accent: #35d0ba; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The dark backdrop goes on <html> ONLY, and <body> must stay transparent.
     AR.js inserts the camera feed as a z-index:-2 element on <body>. In CSS
     paint order, negative-z-index descendants are painted before the
     backgrounds of in-flow block-level descendants -- so an opaque background
     on <body> paints straight over the camera. The symptom is distinctive and
     misleading: the feed appears for a moment, then the view goes black. */
  html { background: #000; }
  body { background: transparent; }

  /* AR.js injects the camera feed as a fixed-position video element and sizes
     the canvas itself; anything of ours has to sit above both. */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    box-sizing: border-box;
    pointer-events: none;
  }
  .overlay.solid {
    background: radial-gradient(circle at 50% 40%, #16233d 0%, #070b14 100%);
    pointer-events: auto;
  }
  .overlay.hidden { display: none; }

  h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  p  { font-size: 1rem; line-height: 1.5; margin: 0 0 20px; max-width: 30rem; opacity: .85; }

  button {
    font: inherit; font-weight: 600;
    padding: 14px 28px; border-radius: 999px; border: 0;
    background: var(--accent); color: var(--ink);
    cursor: pointer; pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(.97); }

  /* Bottom switcher, shown only while the spiral marker is visible.
     Wraps: this was a single row of 2-3 buttons, but there is one button per
     movie, and eight of them overflow a phone screen in both directions —
     leaving most of them unreachable with no indication they exist. */
  #switcher {
    position: fixed; z-index: 10;
    left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 0 12px;
  }
  #switcher.hidden { display: none; }
  #switcher button {
    /* Size to content and wrap, rather than sharing one row equally. */
    flex: 0 1 auto; min-width: 0; max-width: 45%;
    padding: 11px 15px; font-size: .88rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: rgba(10, 16, 28, .62);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, .28);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #switcher button.active {
    background: var(--accent); color: var(--ink);
    border-color: var(--accent);
  }

  /* "Point at the marker" hint while nothing is being tracked. */
  #hint {
    position: fixed; z-index: 10;
    top: calc(16px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px;
    background: rgba(10, 16, 28, .62);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: .9rem; white-space: nowrap;
    transition: opacity .25s ease;
  }
  #hint.hidden { opacity: 0; }

  .spinner {
    width: 34px; height: 34px; margin-bottom: 18px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Diagnostic panel, enabled with ?debug=1. Off by default so the poster
     experience is unaffected. */
  #debug {
    position: fixed; z-index: 20;
    top: calc(8px + env(safe-area-inset-top)); left: 8px;
    max-width: 78vw;
    padding: 9px 11px; border-radius: 8px;
    background: rgba(3, 7, 14, .82);
    border: 1px solid rgba(255,255,255,.16);
    font: 10px/1.42 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; pointer-events: auto;
  }
  #debug.hidden { display: none; }
  #debug b { color: var(--accent); font-weight: 600; }
  #debug .bad  { color: #ff8080; }
  #debug .good { color: #7ee787; }
  #debug input[type=range] { width: 100%; margin: 6px 0 0; }

  /* Gestures are handled on the canvas directly, so the browser must not
     claim the touches for scrolling or its own pinch-zoom first. */
  a-scene canvas { touch-action: none; }

  /* Transient readout shown while pinching. */
  #zoomReadout {
    position: fixed; z-index: 20;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 12px 20px; border-radius: 12px;
    background: rgba(3, 7, 14, .74);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums;
    pointer-events: none; opacity: 0; transition: opacity .18s ease;
    text-align: center; line-height: 1.25;
  }
  #zoomReadout.show { opacity: 1; }
  #zoomReadout small {
    display: block; font-size: .72rem; font-weight: 500;
    opacity: .65; margin-top: 3px; letter-spacing: .02em;
  }

  /* Only offered once the viewer has actually changed the size. */
  #resetZoom {
    position: fixed; z-index: 20;
    left: 50%; transform: translateX(-50%);
    bottom: calc(74px + env(safe-area-inset-bottom));
    padding: 9px 18px; border-radius: 999px;
    font-size: .85rem; font-weight: 600;
    background: rgba(10, 16, 28, .68);
    color: #fff; border: 1.5px solid rgba(255,255,255,.28);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #resetZoom.hidden { display: none; }

  .error { color: #ff8080; font-weight: 600; }
  code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 4px; }

  /* AR.js appends its own unstyled error banner to <body> on camera failure.
     We surface the same condition through the camera-error event with our own
     UI, so suppress theirs. */
  #error-popup { display: none !important; }

  /* The video elements are decoded into WebGL textures, never displayed
     directly. They are kept off-screen rather than display:none, which some
     mobile browsers treat as licence to stop decoding. */
  .texture-source {
    position: fixed; top: 0; left: 0;
    width: 2px; height: 2px;
    opacity: 0.001; pointer-events: none; z-index: -1;
  }
</style>
</head>
<body>

<!-- ── Start gate ─────────────────────────────────────────────────────────
     This screen is not decoration. iOS Safari will not let a <video> feed a
     WebGL texture unless play() has been called inside a real user gesture,
     so the tap here is what unlocks both clips for later programmatic play().
     It also delays the camera permission prompt until the user expects it. -->
<div id="gate" class="overlay solid">
  <h1>Spirochete motility in AR</h1>
  <p>Point your camera at any of the markers on the poster to watch that
     figure's recording play in place.</p>
  <button id="startBtn">Start camera</button>
  <p id="gateNote" style="margin-top:18px; font-size:.82rem; opacity:.6;">
    Your camera feed stays on your device &mdash; nothing is uploaded.
  </p>
</div>

<div id="loading" class="overlay solid hidden">
  <div class="spinner"></div>
  <p>Starting camera&hellip;</p>
</div>

<div id="hint" class="hidden">Point at a marker on the poster</div>

<div id="debug" class="hidden"></div>

<div id="zoomReadout"></div>
<button id="resetZoom" class="hidden">Reset size</button>

<!-- Buttons and <video> elements are both generated from the CLIPS list in
     the script below, so a clip is declared in exactly one place. -->
<div id="switcher" class="hidden"></div>

<!-- ── AR scene ───────────────────────────────────────────────────────────
     Held in a <template> and injected on tap. AR.js opens the camera as soon
     as the scene initialises, so leaving this in the document would fire the
     permission prompt on page load — before the user has any idea why the
     page wants their camera. Injecting later gives AR.js an ordinary
     first-time startup, just deferred. -->
<template id="sceneTemplate">
<a-scene
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  renderer="antialias: true; alpha: true; precision: medium; colorManagement: true"
  embedded
  arjs="sourceType: webcam;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3_HAMMING63;
        patternRatio: 0.5;
        maxDetectionRate: 30;
        canvasWidth: 640;
        canvasHeight: 480;
        debugUIEnabled: false;">

  <!-- The <a-marker> elements themselves are generated from the MARKERS list
       in the script below and appended here at startup. -->
  <a-entity camera></a-entity>
</a-scene>
</template>

<!-- ── One marker's contents ──────────────────────────────────────────────
     Cloned once per marker into its <a-marker>. These are classes, not ids,
     because there is one copy per marker and duplicate ids would break every
     lookup in the file.

     The marker defines a local space where 1 unit == the printed width of the
     black square. Everything here is therefore in "marker widths", which
     keeps the layout correct at any print size. -->
<template id="screenTemplate">
  <!-- Marker-local axes: +X right across the poster, +Y out of the paper,
       -Z up the poster. So rotation -90 about X lays a plane flat against
       the poster, and a negative Z position lifts it up the page.
       position.z is overwritten from LAYOUT.offsetAbove at startup. -->
  <a-entity class="screenRoot" rotation="-90 0 0" position="0 0.01 -1.8">
    <!-- Backing plate. Three separate things keep it from z-fighting with
         the video plane in front of it, because AR.js's projection uses
         near=0.005 / far=10000 — a ratio of 2,000,000, which leaves very
         little usable depth precision:
           1. a real geometric gap (0.04 marker-widths, ~3mm at an 80mm
              marker, invisible from the front),
           2. depth-bias, which offsets it in depth-buffer units and so
              holds up at any viewing distance,
           3. opaque rather than semi-transparent, so it sorts into the
              opaque pass and draws before the video rather than after it.
         Symptom when this goes wrong: scattered translucent navy blocks
         scattered across the video. -->
    <a-plane class="bezel"
             width="2.56" height="2.56"
             position="0 0 -0.04"
             depth-bias="factor: 2; units: 2"
             material="shader: flat; color: #0b1221"></a-plane>

    <!-- size and material src are both set at runtime from CLIPS -->
    <a-plane class="screen"
             width="2.4" height="2.4"
             material="shader: flat; side: front"></a-plane>
  </a-entity>
</template>

<script>
/**
 * Push a surface away from the camera in depth-buffer units.
 *
 * Unlike a geometric offset, polygon offset is applied in the same units the
 * depth buffer is quantised to, so it stays effective no matter how far away
 * the viewer stands — which a fixed world-space gap does not, since depth
 * resolution degrades with the square of distance.
 *
 * A-Frame's material component doesn't expose these three.js properties, so
 * set them on the mesh material directly.
 */
AFRAME.registerComponent('depth-bias', {
  schema: {
    factor: { type: 'number', default: 1 },
    units:  { type: 'number', default: 1 }
  },
  init: function () { this.apply(); this.el.addEventListener('materialtextureloaded', this.apply.bind(this)); },
  update: function () { this.apply(); },
  apply: function () {
    var mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.material) return;
    mesh.material.polygonOffset = true;
    mesh.material.polygonOffsetFactor = this.data.factor;
    mesh.material.polygonOffsetUnits = this.data.units;
    mesh.material.needsUpdate = true;
  }
});

(function () {
  'use strict';

  // Configuration lives in config.js, shared with print.html so the printed
  // markers can never drift from what this page actually looks for.
  var LAYOUT         = window.SPIRO_AR.LAYOUT;
  var BARCODE_LAYOUT = window.SPIRO_AR.BARCODE_LAYOUT || {};
  var CLIPS          = window.SPIRO_AR.CLIPS;
  var PATTERN_MARKER = window.SPIRO_AR.PATTERN_MARKER;

  function merge() {
    var out = {};
    for (var i = 0; i < arguments.length; i++) {
      var src = arguments[i] || {};
      for (var k in src) if (src.hasOwnProperty(k)) out[k] = src[k];
    }
    return out;
  }

  var gate      = document.getElementById('gate');
  var loading   = document.getElementById('loading');
  var hint      = document.getElementById('hint');
  var switcher  = document.getElementById('switcher');
  var startBtn  = document.getElementById('startBtn');

  var byKey = {};
  var buttons = {};

  // Build the <video> elements and the switcher buttons from CLIPS.
  CLIPS.forEach(function (clip, i) {
    byKey[clip.key] = clip;
    clip.id = '#vid-' + clip.key;
    clip.aspect = clip.aspect || null;   // filled in from metadata below

    var v = document.createElement('video');
    v.id = 'vid-' + clip.key;
    v.className = 'texture-source';
    v.src = clip.src;
    v.loop = true;
    v.muted = true;
    // Not "auto": with one clip per marker, eight of these would all download
    // in full on page load — tens of megabytes over conference wifi before the
    // viewer has pointed at anything. The body of each clip is fetched when its
    // marker is first seen instead.
    //
    // "metadata" rather than "none" because we need videoWidth/videoHeight to
    // shape the plane; with "none" every plane would start square and visibly
    // snap on first play. The moov atom is at the front of the file (ffmpeg
    // +faststart), so this costs a few KB per clip.
    v.preload = 'metadata';
    // Property assignment doesn't cover these two; iOS needs both present
    // or it takes the video fullscreen instead of compositing it.
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    document.body.appendChild(v);
    clip.el = v;

    v.addEventListener('loadedmetadata', function () {
      if (!clip.aspect && v.videoWidth && v.videoHeight) {
        clip.aspect = v.videoWidth / v.videoHeight;
        // Any marker currently showing this clip is the wrong shape until now.
        markers.forEach(function (m) {
          if (m.current === clip.key) layoutScreen(m);
        });
      }
    });

    var b = document.createElement('button');
    b.id = 'btn-' + clip.key;
    b.textContent = clip.label;
    if (i === 0) b.className = 'active';
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var sw = switcherMarker();
      if (sw) switchTo(sw, clip.key);
    });
    switcher.appendChild(b);
    buttons[clip.key] = b;
  });

  // Every marker on the poster: the spiral plus one per clip that declares a
  // barcode. Each record owns its own planes, its own current clip and its
  // own visibility, so nothing here is a singleton any more.
  var MARKERS = [
    { key: PATTERN_MARKER.key, type: 'pattern', url: PATTERN_MARKER.url,
      clips: (PATTERN_MARKER.clips || CLIPS.map(function (c) { return c.key; })),
      switcher: true,
      layout: merge(LAYOUT, PATTERN_MARKER.layout) }
  ].concat(
    CLIPS.filter(function (c) { return typeof c.barcode === 'number'; })
         .map(function (c) {
           return { key: 'barcode-' + c.barcode, type: 'barcode',
                    value: c.barcode, clips: [c.key], switcher: false,
                    // BARCODE_LAYOUT centres the video on the marker; a
                    // per-clip layout can override that again.
                    layout: merge(LAYOUT, BARCODE_LAYOUT, c.layout) };
         })
  );

  // Populated once the scene template is injected.
  var scene = null;
  var markers = [];

  var DEBUG = /[?&]debug=1/.test(location.search);

  function show(el, visible) { el.classList.toggle('hidden', !visible); }

  function fail(message, detail) {
    gate.classList.remove('hidden');
    gate.innerHTML =
      '<h1 class="error">' + message + '</h1><p>' + detail + '</p>';
  }

  // ── one-time gesture unlock ────────────────────────────────────────────
  // Calling play() then immediately pausing, inside the click handler, marks
  // both elements as user-activated. Without this the second clip stays black
  // on iOS when it is switched to later.
  function unlockVideos() {
    var jobs = CLIPS.map(function (clip) {
      var v = clip.el;
      if (!v) return Promise.resolve();
      var p = v.play();
      return (p || Promise.resolve()).then(function () {
        v.pause();
        v.currentTime = 0;
      }).catch(function () { /* unlock is best-effort */ });
    });
    return Promise.all(jobs);
  }

  function anyVisible() {
    return markers.some(function (m) { return m.visible; });
  }

  // The marker whose clip the switcher buttons and tap-to-cycle control.
  function switcherMarker() {
    for (var i = 0; i < markers.length; i++) {
      if (markers[i].visible && markers[i].switcher) return markers[i];
    }
    return null;
  }

  function layoutScreen(m) {
    if (!m || !m.screen) return;
    var clip = byKey[m.current];
    var w = m.layout.width;
    // Fall back to square until the file's real dimensions are known.
    var h = w / ((clip && clip.aspect) || 1);
    m.screen.setAttribute('width', w);
    m.screen.setAttribute('height', h);
    m.bezel.setAttribute('width', w + m.layout.bezelPad);
    m.bezel.setAttribute('height', h + m.layout.bezelPad);
  }

  // ── playback ───────────────────────────────────────────────────────────
  // A clip plays iff at least one visible marker is showing it.
  //
  // This is derived from scratch every time rather than reference-counted on
  // markerFound/markerLost. A counter drifts the moment an event is missed and
  // there is no way to resync it, whereas a pure function of
  // (visible markers x their current clip) cannot drift.
  //
  // It also has to be this way because clips are shared: the spiral marker can
  // be showing 'flow' at the same time as barcode 0. Pausing on one marker's
  // markerLost would then kill playback the other marker still needs.
  function refreshPlayback() {
    var wanted = Object.create(null);
    markers.forEach(function (m) {
      if (m.visible) wanted[m.current] = true;
    });

    CLIPS.forEach(function (clip) {
      var v = clip.el;
      if (!v) return;
      // Guarded so playback resumes where it left off rather than restarting,
      // and so we don't pile up redundant play() promises every frame.
      if (wanted[clip.key]) { if (v.paused) v.play().catch(function () {}); }
      else if (!v.paused)   { v.pause(); }
    });
  }

  // Overlay state is derived too, for the same reason: after looking at a
  // barcode marker and back, a pushed "active" class would be lying about
  // which clip the spiral is showing.
  function refreshChrome() {
    var sw = switcherMarker();
    // Buttons that silently do nothing are worse than absent buttons, and a
    // barcode marker has exactly one clip, so there is nothing to offer.
    show(switcher, !!sw);
    Object.keys(buttons).forEach(function (k) {
      buttons[k].classList.toggle('active', !!sw && sw.current === k);
    });
    show(hint, !anyVisible());
  }

  function switchTo(m, key) {
    if (!m || key === m.current || !byKey[key]) return;

    var v = byKey[key].el;
    // Pressing a switcher button restarts the clip — unless another visible
    // marker is already showing it, where restarting would yank that marker's
    // playback back to zero.
    var shownElsewhere = markers.some(function (o) {
      return o !== m && o.visible && o.current === key;
    });

    m.current = key;
    m.screen.setAttribute('material', 'src', byKey[key].id);
    layoutScreen(m);

    if (v && !shownElsewhere && m.visible) v.currentTime = 0;
    refreshPlayback();
    refreshChrome();
  }

  // ── scene startup ──────────────────────────────────────────────────────
  function startScene() {
    var tpl = document.getElementById('sceneTemplate');
    var frag = tpl.content.cloneNode(true);

    if (DEBUG) {
      // AR.js's own debug UI renders the thresholded binary image it actually
      // runs detection on — by far the most informative view when a marker
      // isn't being picked up.
      var sceneEl = frag.querySelector('a-scene');
      sceneEl.setAttribute('arjs',
        sceneEl.getAttribute('arjs').replace('debugUIEnabled: false',
                                             'debugUIEnabled: true'));
    }

    // Markers are built into the cloned fragment, before it enters the
    // document, so AR.js sees a complete scene at init and there is no
    // ordering to reason about. Building into the fragment rather than the
    // template also means a second startScene() (e.g. after a camera retry)
    // can't duplicate them.
    var sceneRoot = frag.querySelector('a-scene');
    MARKERS.forEach(function (cfg) {
      var m = buildMarker(cfg);
      if (m) { sceneRoot.appendChild(m.el); markers.push(m); }
    });

    document.body.appendChild(frag);

    scene = document.querySelector('a-scene');

    markers.forEach(function (m) {
      // Pausing when a marker leaves frame means a viewer who looks away and
      // back resumes where they left off instead of missing content. Which
      // clips actually play is decided by refreshPlayback, not here, because
      // two markers can share one clip.
      m.el.addEventListener('markerFound', function () {
        m.visible = true;
        refreshPlayback();
        refreshChrome();
      });
      m.el.addEventListener('markerLost', function () {
        m.visible = false;
        refreshPlayback();
        refreshChrome();
      });
    });

    function ready() {
      markers.forEach(function (m) {
        m.screen.setAttribute('material', 'src', byKey[m.current].id);
        layoutScreen(m);
      });
      show(loading, false);
      show(hint, true);
      refreshChrome();
      initGestures();
    }

    if (scene.hasLoaded) ready();
    else scene.addEventListener('loaded', ready);

    if (DEBUG) startDiagnostics();
  }

  // Build one <a-marker> and its planes. Returns a marker record, or null if
  // the config entry is unusable — a bad entry is skipped with an error rather
  // than thrown, so one typo can't cost the whole scene mid-conference.
  function buildMarker(cfg) {
    var clips = (cfg.clips || []).filter(function (k) { return !!byKey[k]; });
    if (!clips.length) {
      console.error('[marker ' + cfg.key + '] no valid clips, skipping', cfg.clips);
      return null;
    }

    var el = document.createElement('a-marker');
    el.id = 'marker-' + cfg.key;   // for devtools; nothing looks it up

    if (cfg.type === 'barcode') {
      if (!(cfg.value >= 0 && cfg.value <= 7 && cfg.value % 1 === 0)) {
        console.error('[marker ' + cfg.key + '] barcode id must be an integer ' +
                      '0-7 for 3x3_HAMMING63, got ' + cfg.value);
        return null;
      }
      el.setAttribute('type', 'barcode');
      // Maps to arjs-anchor.barcodeValue. Out-of-range ids are accepted
      // silently by AR.js and simply never match, hence the check above.
      el.setAttribute('value', String(cfg.value));
    } else {
      if (!cfg.url) {
        console.error('[marker ' + cfg.key + '] pattern marker needs a url');
        return null;
      }
      el.setAttribute('type', 'pattern');
      el.setAttribute('url', cfg.url);
    }

    // These must be kebab-case. HTML attribute names are case-insensitive, and
    // AR.js registers the a-marker primitive's mappings as "smooth-count" etc,
    // so a camelCase "smoothCount" is silently ignored and the default is used
    // instead — with no warning anywhere.
    //
    // Smoothing matters twice over here: it damps the few-degrees-per-frame
    // pose jitter that is very obvious on a large video plane, and it means a
    // single frame's misread barcode id never reaches the threshold to show.
    el.setAttribute('smooth', 'true');
    el.setAttribute('smooth-count', '10');
    el.setAttribute('smooth-tolerance', '0.01');
    el.setAttribute('smooth-threshold', '5');
    // Deliberately no emitevents: it has no mapping in AR.js 3.4.7 and is
    // inert. markerFound/markerLost fire unconditionally from arjs-anchor.

    el.appendChild(
      document.getElementById('screenTemplate').content.cloneNode(true));

    var layout = merge(LAYOUT, cfg.layout);
    var screenRoot = el.querySelector('.screenRoot');
    // y lifts the planes a hair off the paper; -z moves them up the poster.
    // offsetAbove 0 leaves the video sitting directly over its marker.
    //
    // Must be a STRING, not {x, y, z}. This runs before the marker is in the
    // document, and A-Frame stringifies an object value on an uninitialised
    // entity to "[object Object]", which parses back as NaN NaN with the
    // missing third component defaulted to 0. A NaN transform silently stops
    // the whole subtree rendering — the marker still tracks and markerFound
    // still fires, so it looks exactly like a marker that works but shows
    // nothing.
    screenRoot.setAttribute('position',
      '0 0.01 ' + (-layout.offsetAbove));

    return {
      key:        cfg.key,
      type:       cfg.type,
      value:      cfg.value,
      switcher:   !!cfg.switcher && clips.length > 1,
      clips:      clips,
      current:    clips[0],
      visible:    false,
      layout:     layout,
      el:         el,
      screenRoot: screenRoot,
      bezel:      el.querySelector('.bezel'),
      screen:     el.querySelector('.screen')
    };
  }

  // ── touch gestures ─────────────────────────────────────────────────────
  // Handled on the canvas with pointer events rather than through A-Frame's
  // raycaster. A-Frame only emits "click" on entities when the camera carries
  // a cursor component, which AR.js scenes don't set up, so raycaster-based
  // taps silently never fire. Doing it at the DOM level also means pinch and
  // tap share one gesture state machine and can't both fire from one touch.
  var ZOOM_MIN = 0.4, ZOOM_MAX = 3.0;
  var ZOOM_KEY = 'spiro-ar-zoom';
  var zoom = 1;

  function loadZoom() {
    var v = parseFloat(localStorage.getItem(ZOOM_KEY));
    return (isFinite(v) && v >= ZOOM_MIN && v <= ZOOM_MAX) ? v : 1;
  }

  function applyZoom(save) {
    // One shared zoom for every marker: a pinch carries no indication of which
    // marker it means, and a viewer sees one marker at a time and expects
    // "bigger" to stick.
    markers.forEach(function (m) {
      if (m.screenRoot && m.screenRoot.object3D) {
        m.screenRoot.object3D.scale.set(zoom, zoom, zoom);
      }
    });
    document.getElementById('resetZoom')
            .classList.toggle('hidden', Math.abs(zoom - 1) < 0.02);
    if (save) {
      try { localStorage.setItem(ZOOM_KEY, zoom.toFixed(3)); } catch (e) {}
    }
  }

  var readoutTimer = null;
  function showReadout() {
    var el = document.getElementById('zoomReadout');
    // The second line is the number to paste into LAYOUT.width if you want to
    // make the current size the permanent default.
    el.innerHTML = zoom.toFixed(2) + '&times;' +
      '<small>LAYOUT.width ' + (LAYOUT.width * zoom).toFixed(2) + '</small>';
    el.classList.add('show');
    clearTimeout(readoutTimer);
    readoutTimer = setTimeout(function () { el.classList.remove('show'); }, 900);
  }

  function initGestures() {
    var canvas = scene.canvas;
    if (!canvas || canvas.dataset.gestures) return;
    canvas.dataset.gestures = '1';

    zoom = loadZoom();
    applyZoom(false);

    var pointers = new Map();
    var pinchStartDist = 0, pinchStartZoom = 1, pinching = false;
    var downAt = 0, downPos = null, moved = false;

    function dist() {
      var p = Array.from(pointers.values());
      return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    }

    canvas.addEventListener('pointerdown', function (e) {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        downAt = performance.now();
        downPos = { x: e.clientX, y: e.clientY };
        moved = false;
      } else if (pointers.size === 2) {
        pinching = true;
        pinchStartDist = dist();
        pinchStartZoom = zoom;
        showReadout();
      }
    });

    canvas.addEventListener('pointermove', function (e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1 && downPos) {
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 12) moved = true;
        return;
      }
      if (pointers.size === 2 && pinchStartDist > 0) {
        e.preventDefault();
        var next = pinchStartZoom * (dist() / pinchStartDist);
        zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
        applyZoom(false);
        showReadout();
      }
    }, { passive: false });

    function release(e) {
      pointers.delete(e.pointerId);

      if (pinching) {
        // Wait until every finger is up, so lifting one of two doesn't get
        // mistaken for a tap.
        if (pointers.size === 0) { pinching = false; applyZoom(true); }
        return;
      }

      // Cycles within the switcher marker's own clip list, so a tap while
      // looking at a single-clip barcode marker correctly does nothing.
      var quick = performance.now() - downAt < 400;
      var sw = switcherMarker();
      if (pointers.size === 0 && quick && !moved && sw && sw.clips.length > 1) {
        var i = sw.clips.indexOf(sw.current);
        switchTo(sw, sw.clips[(i + 1) % sw.clips.length]);
      }
    }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    document.getElementById('resetZoom').addEventListener('click', function (e) {
      e.stopPropagation();
      zoom = 1;
      applyZoom(true);
      showReadout();
    });
  }

  // iOS Safari ignores user-scalable=no and will pinch-zoom the whole page
  // unless these are cancelled explicitly.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });

  // ── diagnostics (?debug=1) ─────────────────────────────────────────────
  var stats = {
    frames: 0, fps: 0,
    squares: 0, lastSquareAt: 0,
    patt:   { id: -1, cf: 0, best: 0, at: 0 },
    matrix: { id: -1, cf: 0, best: 0, at: 0 },
    unknown: 0,     // square found but decoded as neither -> ratio/family suspect
    conflicts: 0,   // idPatt AND idMatrix both set: AR.js's pattern-biased
                    // classifier may be swallowing a barcode (see README)
    ids: {}         // idMatrix -> { n, at, best }
  };

  function arContext() {
    // Not public API, and the path has moved between AR.js versions, so reach
    // for it defensively. Verified against 3.4.7.
    try {
      var sys = scene && scene.systems && scene.systems.arjs;
      var sess = sys && (sys._arSession || sys.arSession);
      return (sess && sess.arContext) || null;
    } catch (e) { return null; }
  }

  function arController() {
    var ctx = arContext();
    return (ctx && ctx.arController) || null;
  }

  function startDiagnostics() {
    var panel = document.getElementById('debug');
    show(panel, true);

    var lastFrameTime = performance.now();
    setInterval(function () {
      var now = performance.now();
      stats.fps = Math.round(stats.frames * 1000 / (now - lastFrameTime));
      stats.frames = 0;
      lastFrameTime = now;
    }, 1000);

    var ctrl = null;

    function attachController() {
      ctrl = arController();
      if (!ctrl) return;

      // Expose the binarisation threshold. If the printed marker is under-lit
      // or blown out, the black border never binarises and nothing is
      // detected at any distance.
      if (ctrl.setThreshold) {
        window.setArThreshold = function (v) { ctrl.setThreshold(v); };
      }

      // This is the diagnostic that matters. ARToolKit works in two stages:
      // find a black quadrilateral, then identify its interior. Separating
      // them tells you which half is failing — "no squares" is a
      // lighting/contrast/geometry problem, whereas "squares but nothing
      // identified" points at the .patt, the patternRatio, the marker family,
      // or a marker too small or too oblique to resolve.
      //
      // With mono_and_matrix there are two identify paths, and they report on
      // different fields: patterns carry cfPatt/idPatt, barcodes carry
      // cfMatrix/idMatrix. ev.data.type says which (0 pattern, 1 barcode,
      // -1 unknown). Reading cfPatt unconditionally, as this used to, silently
      // mixes the two.
      if (ctrl.addEventListener) {
        ctrl.addEventListener('getMarker', function (ev) {
          var d = ev && ev.data, m = d && d.marker;
          if (!m) return;
          // ev.data.marker is a single object that AR.js reassigns field by
          // field for every square, so the scalars must be copied out here —
          // stashing the object would give whatever the last square was.
          var now = performance.now();

          if (m.idPatt > -1 && m.idMatrix > -1) stats.conflicts++;

          if (d.type === 0) {
            stats.patt.id = m.idPatt;
            stats.patt.cf = m.cfPatt;
            stats.patt.at = now;
            if (m.cfPatt > stats.patt.best) stats.patt.best = m.cfPatt;
          } else if (d.type === 1) {
            stats.matrix.id = m.idMatrix;
            stats.matrix.cf = m.cfMatrix;
            stats.matrix.at = now;
            if (m.cfMatrix > stats.matrix.best) stats.matrix.best = m.cfMatrix;
            var e = stats.ids[m.idMatrix] ||
                    (stats.ids[m.idMatrix] = { n: 0, at: 0, best: 0 });
            e.n++; e.at = now;
            if (m.cfMatrix > e.best) e.best = m.cfMatrix;
          } else if (d.type === -1) {
            stats.unknown++;
          }
        });
      }
    }

    // Prove the marker family actually took effect. AR.js looks matrixCodeType
    // up in a table and, on a miss, console.asserts (which only logs) and then
    // calls setMatrixCodeType(undefined) — so a mis-cased string like
    // "3x3_hamming63" leaves barcode detection quietly dead. Reading the value
    // back turns that into a visible red line instead of a mystery.
    function codesRow(ctrl) {
      if (!ctrl || !ctrl.getMatrixCodeType) return '<span class="bad">n/a</span>';
      try {
        var tk = ctrl.artoolkit || ctrl;
        var want = tk.AR_MATRIX_CODE_3x3_HAMMING63;
        var got = ctrl.getMatrixCodeType();
        var ratio = ctrl.getPattRatio ? ctrl.getPattRatio() : null;
        var ok = (want === undefined) ? null : (got === want);
        return (ok === null
                  ? '<span class="good">set (' + got + ')</span>'
                  : ok ? '<span class="good">3x3_HAMMING63 OK</span>'
                       : '<span class="bad">WRONG (' + got + ')</span>') +
               (ratio !== null ? '  ratio ' + ratio.toFixed(2) : '');
      } catch (e) { return '<span class="bad">n/a</span>'; }
    }

    function render() {
      stats.frames++;

      if (!ctrl) attachController();
      if (ctrl && ctrl.getMarkerNum) {
        var n = ctrl.getMarkerNum();
        if (n > 0) { stats.squares = n; stats.lastSquareAt = performance.now(); }
      }

      var now = performance.now();
      var camVid = document.querySelector('#arjs-video');
      var thr = ctrl && ctrl.getThreshold ? ctrl.getThreshold() : null;
      var recent = function (t) { return t && (now - t) < 500; };

      function stage(label, s, need) {
        if (!recent(s.at)) {
          return label + '<span class="bad">none</span>' +
                 (s.best ? '  best ' + s.best.toFixed(2) : '') + '\n';
        }
        return label + 'id ' + s.id + '  ' +
               '<span class="' + (s.cf >= need ? 'good' : 'bad') + '">' +
               s.cf.toFixed(3) + '</span> (need ≥' + need.toFixed(2) + ')' +
               (s.best ? '  best ' + s.best.toFixed(2) : '') + '\n';
      }

      // Which barcode ids decoded recently. With barcodes the question is not
      // "did it work" but "did my printed square decode to the number I
      // think" — a misread surfaces as a different id, not as a failure.
      var idList = Object.keys(stats.ids)
        .filter(function (k) { return recent(stats.ids[k].at); })
        .map(function (k) { return k + '×' + stats.ids[k].n; })
        .join('  ') || '—';

      var markerRows = markers.map(function (m) {
        var vis = m.el && m.el.object3D && m.el.object3D.visible;
        var d = vis ? m.el.object3D.position.length() : null;
        return '  ' + (m.key + '          ').slice(0, 11) +
               (vis ? '<span class="good">FOUND</span>  ' +
                      d.toFixed(2) + ' mw  ' + m.current
                    : '<span style="opacity:.45">—</span>');
      }).join('\n');

      var playing = CLIPS.filter(function (c) { return c.el && !c.el.paused; })
                         .map(function (c) { return c.key; }).join(' ') || '—';

      panel.innerHTML =
        '<b>AR diagnostics</b>\n' +
        'codes      ' + codesRow(ctrl) + '\n' +
        '1 squares  ' + (recent(stats.lastSquareAt)
            ? '<span class="good">' + stats.squares + ' seen</span>'
            : '<span class="bad">none — lighting/contrast</span>') + '\n' +
        stage('2a pattern ', stats.patt, 0.6) +
        stage('2b barcode ', stats.matrix, 0.6) +
        '   ids     ' + idList + '\n' +
        '   unknown ' + stats.unknown +
            '   conflicts ' + (stats.conflicts
              ? '<span class="bad">' + stats.conflicts + '</span>'
              : '0') + '\n' +
        '<b>markers</b>\n' + markerRows + '\n' +
        'playing    ' + playing + '\n' +
        'render     ' + stats.fps + ' fps\n' +
        'camera     ' + (camVid && camVid.videoWidth
            ? camVid.videoWidth + '×' + camVid.videoHeight
            : '<span class="bad">no feed</span>') + '\n' +
        'threshold  ' + (thr !== null ? thr : '—') +
            '  <i>setArThreshold(0-255)</i>';

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }

  // ── wiring ─────────────────────────────────────────────────────────────
  startBtn.addEventListener('click', function () {
    // Camera access requires a secure context. localhost is exempt, which is
    // why local testing over plain http works but a LAN IP does not.
    if (!window.isSecureContext) {
      fail('HTTPS required',
           'Browsers only expose the camera on secure origins. Open this page ' +
           'over <code>https://</code> (or on <code>localhost</code>).');
      return;
    }

    show(gate, false);
    show(loading, true);

    // Must run inside this handler's user-gesture context, before any await.
    unlockVideos().then(startScene, startScene);
  });

  // AR.js surfaces camera failures through this event rather than throwing.
  window.addEventListener('camera-error', function () {
    show(loading, false);
    show(switcher, false);
    show(hint, false);
    fail('Camera unavailable',
         'Permission was denied, or another app is using the camera. Allow ' +
         'camera access in your browser settings and reload.');
  });

})();
</script>
</body>
</html>
